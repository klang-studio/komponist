<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Clip automation</title>
<link rel="stylesheet" href="base.css"><script src="lib.js"></script>
<style>
  .tbtn { position: absolute; height: 24px; padding: 0 10px 0 8px; border-radius: 2px; display: flex; align-items: center; gap: 6px; font: 500 12px/16px "Plex Sans"; }
  .tbtn svg { width: 12px; height: 12px; }
  .lchip { position: absolute; height: 18px; padding: 1px 16px 0 6px; border-radius: 2px; background: var(--surface-3); font: 400 11px/16px "Plex Sans"; color: var(--text-1); white-space: nowrap; }
  .lchip .caret { position: absolute; right: 5px; top: 7px; width: 0; height: 0; border-left: 3.5px solid transparent; border-right: 3.5px solid transparent; border-top: 4px solid var(--text-2); }
  .icbtn { position: absolute; width: 18px; height: 18px; border-radius: 2px; display: flex; align-items: center; justify-content: center; color: var(--text-2); }
  .icbtn svg { width: 12px; height: 12px; }
</style></head>
<body>
<script>
const G = "#63b376";
crop(0, 0, 1920, 1080, 0, 0);
// Arrangement (unchanged rows) above a taller dock.
crop(260, 95, 1378, 545, 260, 95);
const hdr = [[96, "#dc855d", "Drums", "Sampler", "none"], [152, "#61a3e6", "Bass", "Hexa", "hidden"], [208, G, "Lead", "Hexa", "hidden"],
             [264, "#aa8dde", "Pad", "Surge XT", "none"], [320, "#b69d3a", "Keys", "Dexed", "none"], [376, "#5e7d80", "Arp", "Vital", "none"]];
hdr.forEach(([y, c, n, s, a]) => trackHeader({ y, srcY: y, color: c, name: n, sub: s, auto: a, sel: n === "Lead", muted: n === "Arp" }));
for (const x of [1204 - 13, 1348 - 13]) el("div", "abs", { left: px(x), top: px(211), width: "10px", height: "10px", color: "#14361d" }, ICON.spline);
rect(260, 640, 1378, 1, "var(--surface-0)");

// Dock: tabs + toolbar, ruler + notes, the new clip-automation lane, velocity.
const DT = 641;
crop(260, 737, 1378, 56, 260, DT);
crop(260, 793, 1378, 200, 260, DT + 56);
const LY = DT + 256, LH = 96;
crop(260, 993, 1378, 64, 260, LY + LH);

// toolbar: the "Automation" toggle after "17 NOTEN" (on)
const tb = el("div", "tbtn", { left: "820px", top: px(DT + 29), background: "var(--surface-4)", color: "var(--text-1)" }, ICON.spline + "Automation");

// lane: keyboard column + body
rect(260, LY, 53, LH, "var(--surface-2)", { borderTop: "1px solid var(--surface-0)" });
el("div", "abs", { left: "277px", top: px(LY + 8), width: "14px", height: "14px", color: "var(--text-2)" }, ICON.spline);
text(268, LY + LH - 18, "t-vs", "0", { color: "var(--text-4)" });
text(268, LY + 26, "t-vs", "100", { color: "var(--text-4)" });
const BX0 = 313, BX1 = 1638, PPB = 320;      // piano-roll zoom: 320 px per bar, bar 9 at x 313
BAR0 = BX0 - 8 * PPB; PX_PER_BAR = PPB; BODY_X0 = BX0; BODY_X1 = BX1;
rect(BX0, LY, BX1 - BX0, LH, "#141618", { borderTop: "1px solid var(--surface-0)" });
const svg = svgLayer(BX0, LY, BX1 - BX0, LH);
for (let x = BX0, i = 0; x < BX1; x += PPB / 16, i++) {
  const c = i % 16 === 0 ? "#45484d" : i % 4 === 0 ? "#2b2d30" : "#1e1f22";
  svgEl(svg, "line", { x1: Math.round(x) + 0.5, y1: LY + 1, x2: Math.round(x) + 0.5, y2: LY + LH, stroke: c });
}
const pad = 8, Y = (v) => LY + pad + (1 - v) * (LH - 2 * pad);
svgEl(svg, "line", { x1: BX0, y1: Math.round(Y(0.5)) + 0.5, x2: BX1, y2: Math.round(Y(0.5)) + 0.5, stroke: "#2b2d30", "stroke-dasharray": "2 3" });
const clipEnd = X(11);
const pts = [{ b: 9, v: 0.20, s: -0.45 }, { b: 10.5, v: 0.90, s: "lin" }, { b: 10.98, v: 0.28, s: "lin" }];
drawCurve(svg, Y, pts, { from: BX0, to: clipEnd, line: G, fill: "#14361d", bottom: LY + LH });
drawPoints(svg, Y, pts, { color: G, selected: [1], handles: [0] });
// outside the clip's content: dimmed (canvas.outside-clip), the lane holds the last value
rect(clipEnd, LY + 1, BX1 - clipEnd, LH - 1, "var(--outside-clip)");
const s2 = svgLayer(clipEnd, LY, BX1 - clipEnd, LH);
svgEl(s2, "line", { x1: clipEnd, y1: Y(0.28), x2: BX1, y2: Y(0.28), stroke: "#4a4d52", "stroke-width": 1, "stroke-dasharray": "3 3" });
// playhead (10.2.120)
rect(753, LY, 1, LH, "var(--text-1)");

// lane chip (chooser), value and remove at the top
const chip = el("div", "lchip", { left: px(BX0 + 6), top: px(LY + 5) }, '<span style="color:var(--text-3)">Hexa&nbsp;·&nbsp;</span>Feedback<span class="caret"></span>');
el("div", "chip", { left: px(BX1 - 140), top: px(LY + 4), right: "auto", width: "58px" }, 'Lesen<span class="caret"></span>');
text(BX1 - 72, LY + 8, "t-vs", Math.round(100 * valueAt(pts, 1 + (753 - BAR0) / PX_PER_BAR)) + " %", { color: "var(--text-2)" });
el("div", "icbtn", { left: px(BX1 - 26), top: px(LY + 5) }, ICON.x);

// value tooltip on the selected point
const tip = el("div", "tooltip", { top: px(Y(0.9) - 11) }, '<span class="k">Feedback</span>&nbsp;·&nbsp;90 %&nbsp;·&nbsp;10.3.000');
tip.style.left = px(X(10.5) + 12);

// status bar
rect(0, 1059, 1000, 21, "var(--surface-1)");
text(12, 1062, "t-small", "Lead A · Clip-Automation Feedback · 1 Punkt ausgewählt", { color: "var(--text-1)" });
text(330, 1062, "t-small", "Doppelklick: Punkt · Strg-Ziehen: zeichnen · Alt-Ziehen: Kopie · Shift: fein", { color: "var(--text-2)" });
translateEn();
</script>
</body></html>
