[workspace]
resolver = "3"
members = ["author", "example", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
clap-sys = "=0.5.0"
serde_json = "=1.0.154"
komponist-device-core = { path = "../../crates/builtin-devices/core" }
komponist-ipc = { path = "../../crates/komponist-ipc" }
komponist-model = { path = "../../crates/komponist-model" }
komponist-native-clap-sdk = { path = "author" }
nice-plug = { git = "https://github.com/klang-studio/nice-plug", rev = "ae293198a5def51d89f82ce8e9ad77f255f32b00", default-features = false }
