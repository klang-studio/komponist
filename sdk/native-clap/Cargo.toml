[workspace]
resolver = "3"
members = [
    "author",
    "example",
    "xtask",
    "bundled/adapter",
    "bundled/hall",
    "bundled/delay",
    "bundled/eq",
    "bundled/presse",
    "bundled/limiter",
    "bundled/volt",
    "bundled/hexa",
    "bundled/sampler",
    "bundled/general-sampler",
    "bundled/arpeggiator",
    "bundled/scale",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
clap-sys = "=0.5.0"
serde_json = "=1.0.154"
komponist-device-core = { path = "../../crates/builtin-devices/core" }
komponist-engine = { path = "../../crates/komponist-engine" }
komponist-i18n = { path = "../../crates/komponist-i18n" }
komponist-ipc = { path = "../../crates/komponist-ipc" }
komponist-model = { path = "../../crates/komponist-model" }
komponist-sampler = { path = "../../crates/builtin-devices/sampler" }
komponist-bundled-clap-adapter = { path = "bundled/adapter" }
komponist-native-clap-sdk = { path = "author" }
nice-plug = { git = "https://github.com/klang-studio/nice-plug", rev = "4a376c7f60775da0455ba0c72c1a7b7d2d56dbdc", default-features = false }
