[workspace]
resolver = "3"
members = ["crates/*"]
# Own workspaces or throwaway code, never part of this build (ARCHITECTURE §4).
exclude = ["spikes", "test-plugins"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Workspace crates.
komponist-tokens = { path = "crates/komponist-tokens" }
komponist-model = { path = "crates/komponist-model" }
komponist-engine = { path = "crates/komponist-engine" }
komponist-audio = { path = "crates/komponist-audio" }
komponist-builtin = { path = "crates/komponist-builtin" }
komponist-ipc = { path = "crates/komponist-ipc" }
komponist-hosting = { path = "crates/komponist-hosting" }
komponist-plugins = { path = "crates/komponist-plugins" }
komponist-bridge = { path = "crates/komponist-bridge" }
komponist-ui = { path = "crates/komponist-ui" }
komponist-i18n = { path = "crates/komponist-i18n" }
hexa-core = { path = "crates/hexa-core", features = ["alloc", "serde"] }

# Sibling repositories, referenced by relative path. A worktree must therefore sit exactly
# one level below <workspace>/ (PLAN §1.2).
klang-dsp = { path = "../klang-dsp" }
libm = "0.2"
# klopfer's RT sampler engine (voices, pads, envelopes, interpolation), GPL-3.0-or-later like komponist (WP-87).
klopfer_dsp = { path = "../klopfer/dsp" }

# UI (egui/eframe 0.37 family; versions must move together).
egui = "0.37.0"
eframe = { version = "0.37.0", features = ["wgpu", "inspection", "accesskit"] }
egui_extras = { version = "0.37.0", features = ["svg"] }
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot", "eframe"] }
# eframe 0.37 does not re-export winit. Same version as egui-winit uses; only for
# `EventLoopBuilderExtX11::with_x11()` in komponist-ui's eframe setup.
winit = { version = "0.30.13", default-features = false, features = ["x11"] }

# Audio and MIDI I/O.
cpal = { version = "0.18.2", features = ["pipewire", "jack"] }
midir = "0.11.1"

# Plugin format layer (linked only by komponist-bridge via komponist-hosting; the komponist binary
# carries the bridge since WP-94).
# truce-rack is added only if gate G4 picks it (ARCHITECTURE §2.4, D3).
clack-host = "0.2.0"
clack-extensions = "0.2.0"
vst3 = "0.3.0"

# Realtime plumbing and OS interfaces.
rtrb = "0.4.1"
# komponist-app: local calendar time (`localtime_r`) for "heute 09:12", "gestern", "12. Okt.".
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["mm", "thread", "process", "net"] }
x11rb = "0.14.0"

# Text catalog generator (komponist-i18n build script): Project Fluent parser, Apache-2.0 OR MIT.
fluent-syntax = "0.12.0"
# komponist: the system language for "System" in the language setting (MIT OR Apache-2.0; already in the tree via egui).
sys-locale = "0.3.2"

# Serialization and files.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
postcard = "1.1.3"
base64 = "0.23.1"
hound = "3.5.1"

# komponist-app: the EQ's live spectrum (WP-92). Real-input FFT on top of rustfft, MIT.
realfft = "3.5.1"

# Testing.
assert_no_alloc = "1.1.2"
proptest = "1.12.0"

# Keep debug builds small: dependency debug info made every worktree's target/ 8–14 GB
# (2026-11-13, disk nearly full). Line tables keep useful backtraces for our own code.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
