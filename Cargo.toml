[workspace]
resolver = "3"
members = [
    "crates/komponist-*",
    "crates/builtin-devices/hexa/core",
    "crates/builtin-devices/sampler-shared/core",
    "crates/builtin-devices/*",
    "crates/builtin-devices/*/clap",
]
# Own workspaces or throwaway code, never part of this build (ARCHITECTURE §4).
exclude = ["test-plugins", "crates/plugin-sdk"]

[workspace.package]
version = "0.2.0"
edition = "2024"
# The toolchain is pinned in rust-toolchain.toml (#241); keep both in step.
rust-version = "1.100"
license = "GPL-3.0-or-later"
publish = false

# Crates without unsafe code (tokens, model, audiofile, i18n) carry `#![forbid(unsafe_code)]` in their lib.rs: a
# workspace-wide `unsafe_code = "forbid"` would break the crates that need unsafe, and `[lints] workspace = true`
# cannot be partly overridden.
[workspace.lints.clippy]
# The gate runs clippy with `-D warnings`, so `warn` fails a crate that lacks SAFETY comments. Crates that are
# not clean yet carry a crate-level `#![allow(clippy::undocumented_unsafe_blocks)]` naming the count
# ("#241 follow-up"); remove it when the crate is clean.
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
# Workspace crates.
komponist-tokens = { path = "crates/komponist-tokens" }
komponist-model = { path = "crates/komponist-model" }
komponist-device-dsp = { path = "crates/komponist-device-dsp" }
komponist-engine = { path = "crates/komponist-engine" }
komponist-processor = { path = "crates/komponist-processor" }
komponist-audio = { path = "crates/komponist-audio" }
komponist-arpeggiator = { path = "crates/builtin-devices/arpeggiator" }
komponist-bundled-clap-adapter = { path = "crates/plugin-sdk/bundled-adapter" }
komponist-delay = { path = "crates/builtin-devices/delay" }
komponist-device-core = { path = "crates/builtin-devices/core" }
komponist-eq = { path = "crates/builtin-devices/eq" }
komponist-general-sampler = { path = "crates/builtin-devices/general-sampler" }
komponist-hexa = { path = "crates/builtin-devices/hexa" }
komponist-limiter = { path = "crates/builtin-devices/limiter" }
komponist-native-clap-sdk = { path = "crates/plugin-sdk/author" }
komponist-presse = { path = "crates/builtin-devices/presse" }
komponist-reverb = { path = "crates/builtin-devices/reverb" }
komponist-sampler = { path = "crates/builtin-devices/sampler" }
komponist-sampler-clap = { path = "crates/builtin-devices/sampler-shared/clap" }
komponist-sampler-shared = { path = "crates/builtin-devices/sampler-shared" }
komponist-scale = { path = "crates/builtin-devices/scale" }
komponist-surf = { path = "crates/builtin-devices/surf" }
komponist-volt = { path = "crates/builtin-devices/volt" }
komponist-ipc = { path = "crates/komponist-ipc" }
komponist-plugin-api = { path = "crates/komponist-plugin-api" }
komponist-rt = { path = "crates/komponist-rt" }
komponist-audiofile = { path = "crates/komponist-audiofile" }
komponist-stretch = { path = "crates/komponist-stretch" }
komponist-hosting = { path = "crates/komponist-hosting" }
komponist-plugins = { path = "crates/komponist-plugins" }
komponist-bridge = { path = "crates/komponist-bridge" }
komponist-ui = { path = "crates/komponist-ui" }
komponist-i18n = { path = "crates/komponist-i18n" }
hexa-core = { path = "crates/builtin-devices/hexa/core", features = ["serde"] }
# The Sampler's RT engine, vendored from klopfer's `dsp` crate (WP-87).
sampler-core = { path = "crates/builtin-devices/sampler-shared/core" }

nice-plug = { git = "https://github.com/klang-studio/nice-plug", rev = "4a376c7f60775da0455ba0c72c1a7b7d2d56dbdc", default-features = false }

# Public DSP library, pinned to one commit. To work on both locally, see docs/INSTALL.md.
# klang-synth (opt-in synth blocks, plugins only) lives in the same repository and must share the
# `rev`, otherwise cargo builds two incompatible klang-dsp packages.
klang-dsp = { git = "https://github.com/klang-studio/klang-dsp", rev = "f9556bda97fb0ef1ce5b53d05001256bf844e9f7" }
klang-synth = { git = "https://github.com/klang-studio/klang-dsp", rev = "f9556bda97fb0ef1ce5b53d05001256bf844e9f7" }
libm = "0.2"

# UI (egui/eframe 0.37 family; versions must move together).
egui = "0.37.0"
eframe = { version = "0.37.0", features = ["wgpu", "inspection", "accesskit"] }
egui_extras = { version = "0.37.0", features = ["svg"] }
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot", "eframe"] }
# eframe 0.37 does not re-export winit. Same version as egui-winit uses; only for
# `EventLoopBuilderExtX11::with_x11()` in komponist-ui's eframe setup (Linux only; the x11
# feature does nothing on macOS).
winit = { version = "0.30.13", default-features = false, features = ["x11"] }

# macOS app menu (komponist-app `macos_menu`, `macos_delegate`: Dock menu, documents from Finder) and the
# plugin frame windows of the bridge (#52): the
# Objective-C bindings eframe/winit already link (objc2 0.6 family); only the AppKit classes these
# need, so Cargo.lock gets no new crate. block2: the key monitor's and notification observers'
# blocks; raw-window-handle: the frame window's `NSView` from eframe (both already in the tree).
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "libc", "objc2-core-foundation", "NSApplication", "NSEvent", "NSGraphics", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSDictionary", "NSGeometry", "NSNotification", "NSOperation", "NSProcessInfo", "NSString", "NSURL", "NSValue"] }
block2 = "0.6.2"
raw-window-handle = "0.6.2"

# Audio and MIDI I/O.
# Backend features are per target, in crates/komponist-audio/Cargo.toml (pipewire, jack: Linux only).
cpal = "0.18.2"
jack = "0.13.5"
jack-sys = "0.5.1"
midir = "0.11.1"

# Plugin format layer (linked only by komponist-bridge via komponist-hosting; the komponist binary
# carries the bridge since WP-94).
# truce-rack is added only if gate G4 picks it (ARCHITECTURE §2.4, D3).
clack-host = "0.2.0"
clap-sys = "0.5.0"
clack-extensions = "0.2.0"
vst3 = "0.3.0"

# Realtime plumbing and OS interfaces.
rtrb = "0.4.1"
# komponist-app: local calendar time (`localtime_r`) for "heute 09:12", "gestern", "12. Okt.".
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["mm", "thread", "process", "net"] }
# Windows port: the Win32 API (shared memory, events, pipes, processes, MMCSS, LoadLibrary). MIT OR
# Apache-2.0; already in the tree through winit, cpal and others, so the lock file gains no new crate.
# Each crate enables only the API features it uses, under `[target.'cfg(windows)'.dependencies]`.
windows-sys = "0.61.2"
# komponist-app build script (Windows hosts only): compiles the icon, version info and manifest resource with the
# MSVC rc.exe. MIT.
embed-resource = "3.0"
x11rb = "0.14.0"

# Text catalog generator (komponist-i18n build script): Project Fluent parser, Apache-2.0 OR MIT.
fluent-syntax = "0.12.0"
# komponist: the system language for "System" in the language setting (MIT OR Apache-2.0; already in the tree via egui).
sys-locale = "0.3.2"

# Portable C++17 compilation for the vendored worker-only Signalsmith wrapper (MIT OR Apache-2.0).
cc = "1.11.2"

# Serialization and files.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Exact pins, moved here from the crates that used them (#241, rule 8): sha2 in komponist-plugins,
# crossbeam-queue in the bundled CLAP devices.
sha2 = "=0.11.1"
crossbeam-queue = "=0.3.14"
postcard = "1.1.3"
base64 = "0.23.1"
hound = "3.5.1"
# Private, exclusive staging files for audio renders. MIT OR Apache-2.0, already in the lockfile.
tempfile = "3.27.0"
# komponist-audiofile (#10): FLAC, OGG Vorbis and MP3 decoding (pure Rust, MPL-2.0, which is GPL-3.0-compatible; WAV
# stays on hound) and sample-rate conversion (rubato, MIT OR Apache-2.0; its FFT resampler uses realfft, already
# in the tree).
symphonia = { version = "0.6.1", default-features = false, features = ["aiff", "pcm", "flac", "mp3", "ogg", "vorbis"] }
rubato = "5.1.0"

# komponist-app: the EQ's live spectrum (WP-92). Real-input FFT on top of rustfft, MIT.
realfft = "3.5.1"

# Testing.
assert_no_alloc = "1.1.2"
proptest = "1.12.0"

# Keep debug builds small: dependency debug info made every worktree's target/ 8–14 GB
# (2026-11-13, disk nearly full). Line tables keep useful backtraces for our own code.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The DSP crates render audio in their tests (hexa-core's preset tests took 3 minutes unoptimised on CI,
# 2026-11-15). Optimised, they also keep debug builds of the app usable. Applies to `cargo test` too.
[profile.dev.package.hexa-core]
opt-level = 2

[profile.dev.package.sampler-core]
opt-level = 2

[profile.dev.package.klang-dsp]
opt-level = 2

[profile.dev.package.klang-synth]
opt-level = 2

# Rust-side chunk validation and mapping accompany optimized C++ even in dev/test.
[profile.dev.package.komponist-stretch]
opt-level = 2
