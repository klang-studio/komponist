# Test plugins for komponist's plugin hosting, IPC and crash handling (PLAN WP-27).
#
# A Cargo workspace of its own, excluded from komponist's: nice-plug brings its own egui, baseview
# and windowing versions, which must never meet the DAW's.
[workspace]
resolver = "3"
members = [
    "kp-test-synth",
    "kp-test-fx",
    "kp-test-crash",
    "kp-test-slow",
    "fake-host",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Same versions as klopfer (../klopfer/Cargo.toml), but straight from crates.io without its forks.
nice-plug = { version = "0.4.2", features = ["assert_process_allocs"] }
nice-plug-egui = "0.5.1"
nice-plug-xtask = "0.1.1"
# The egui of nice-plug-egui, with its default fonts (nice-plug-egui leaves them out).
egui = "0.36.2"

# Tests.
fake-host = { path = "fake-host" }
# The crate behind nice-plug's `assert_process_allocs`, for `assert_no_alloc` around `process`.
nice-assert-no-alloc = "1.0.0"
# `prctl(PR_SET_DUMPABLE)`: no core dumps from the crash tests' child processes.
libc = "0.2.191"

# klang-studio's forks of baseview and the nice-plug crates, from klopfer's submodules, so
# kp-test-synth's embedded GUI draws: the crates.io baseview lacks the X11 Present/MapNotify fix
# (PLAN WP-27 note, WP-50). Only read, never modified here. All nice-plug crates come from the
# same checkout, so they share one nice-plug-core; the list is klopfer's `[patch.crates-io]`.
[patch.crates-io]
baseview = { path = "../../klopfer/vendor/baseview" }
egui-baseview = { path = "../../klopfer/vendor/egui-baseview" }
nice-log = { path = "../../klopfer/vendor/nice-plug/crates/nice-log" }
nice-plug = { path = "../../klopfer/vendor/nice-plug/crates/nice-plug" }
nice-plug-core = { path = "../../klopfer/vendor/nice-plug/crates/nice-plug-core" }
nice-plug-derive = { path = "../../klopfer/vendor/nice-plug/crates/nice-plug-derive" }
nice-plug-egui = { path = "../../klopfer/vendor/nice-plug/crates/nice-plug-egui" }
nice-plug-xtask = { path = "../../klopfer/vendor/nice-plug/crates/nice-plug-xtask" }

[profile.release]
lto = "thin"
