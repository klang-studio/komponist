# Test plugins for komponist's plugin hosting, IPC and crash handling (PLAN WP-27).
#
# A Cargo workspace of its own, excluded from komponist's: nice-plug brings its own egui, baseview
# and windowing versions, which must never meet the DAW's.
[workspace]
resolver = "3"
members = [
    "kp-test-synth",
    "kp-test-fx",
    "kp-test-crash",
    "kp-test-slow",
    "fake-host",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Same versions as klopfer's `Cargo.toml`, but straight from crates.io without its forks.
nice-plug = { version = "0.4.2", features = ["assert_process_allocs"] }
nice-plug-egui = "0.5.1"
nice-plug-xtask = "0.1.1"
# The egui of nice-plug-egui, with its default fonts (nice-plug-egui leaves them out).
egui = "0.37.0"

# Tests.
fake-host = { path = "fake-host" }
# The crate behind nice-plug's `assert_process_allocs`, for `assert_no_alloc` around `process`.
nice-assert-no-alloc = "1.0.0"
# `prctl(PR_SET_DUMPABLE)`: no core dumps from the crash tests' child processes.
libc = "0.2.191"

# klang-studio's forks of baseview and the nice-plug crates (the `klopfer` branches, pinned), so
# kp-test-synth's embedded GUI draws: the crates.io baseview lacks the X11 Present/MapNotify fix
# (PLAN WP-27 note, WP-50). All nice-plug crates come from the same checkout, so they share one
# nice-plug-core; the list is klopfer's `[patch.crates-io]`.
[patch.crates-io]
baseview = { git = "https://github.com/klang-studio/baseview", rev = "2b8211d4c43e78ed93c4deb35f1a9b54fea6d6d3" }
egui-baseview = { git = "https://github.com/klang-studio/egui-baseview", rev = "0bea7196e0e09032ece85401e2b34cd036942595" }
nice-log = { git = "https://github.com/klang-studio/nice-plug", rev = "39e9ad41cf84f98762d86b83abdb9c422fcb58a5" }
nice-plug = { git = "https://github.com/klang-studio/nice-plug", rev = "39e9ad41cf84f98762d86b83abdb9c422fcb58a5" }
nice-plug-core = { git = "https://github.com/klang-studio/nice-plug", rev = "39e9ad41cf84f98762d86b83abdb9c422fcb58a5" }
nice-plug-derive = { git = "https://github.com/klang-studio/nice-plug", rev = "39e9ad41cf84f98762d86b83abdb9c422fcb58a5" }
nice-plug-egui = { git = "https://github.com/klang-studio/nice-plug", rev = "39e9ad41cf84f98762d86b83abdb9c422fcb58a5" }
nice-plug-xtask = { git = "https://github.com/klang-studio/nice-plug", rev = "39e9ad41cf84f98762d86b83abdb9c422fcb58a5" }

[profile.release]
lto = "thin"
