# CI: formatting, clippy, tests (incl. the test plugins and the GUI tests under Xvfb) on every push to
# main and on every pull request, on Linux; clippy and tests (incl. the test plugins) on macOS arm64 too
# (epic #41: macOS 14.4+, Apple Silicon only) and on Windows x86_64 (port in progress, not blocking).
# Local equivalent: scripts/check.sh + scripts/check-gui.sh.
#
# Snapshot tests (egui_kittest, wgpu) render with lavapipe, the software Vulkan driver of Mesa, on the runner,
# while the committed PNGs come from the owner's GPU. Anti-aliasing can differ in single pixels, so this
# workflow writes a kittest.toml with a tolerance (SNAPSHOT_* below) before the tests. Local runs keep kittest's strict
# defaults. If the first CI run fails on snapshots, look at the "snapshot-diffs" artifact first. On macOS the
# committed kittest.toml ([mac], [windows]) renders every snapshot without comparing it (other pixels).
name: CI

# Documentation and README media changes need no build, except the two docs files that code and tests read:
# `docs/clap-device-layout/example.json` (`include_bytes!` in komponist-ipc) and `docs/INSTALL.md` (the packaging
# test). `paths-ignore` cannot re-include a file (no `!`), so this is a `paths` list: everything, minus docs and
# Markdown, plus those two files (a later positive pattern re-includes what a `!` pattern removed).
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "docs/clap-device-layout/example.json"
      - "docs/INSTALL.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "docs/clap-device-layout/example.json"
      - "docs/INSTALL.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Missing test bundles must fail instead of silently skipping plugin coverage.
  KOMPONIST_REQUIRE_FIXTURES: "1"
  # Software Vulkan (lavapipe, from mesa-vulkan-drivers); there is no GPU on the runner.
  WGPU_BACKEND: vulkan
  # kittest tolerance on CI only (per-pixel YIQ distance, number of pixels allowed over it).
  # Starting values, to be tuned after the first run (see the header comment).
  SNAPSHOT_THRESHOLD: "1.0"
  SNAPSHOT_MAX_FAILED_PIXELS: "20"

jobs:
  # One job per platform, named "<OS> <arch>: <checks>" (like the release jobs), so further platforms slot in.
  linux-x86_64:
    name: "Linux x86_64: fmt, clippy, tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The device boundary check compares against the base commit of this Git history.
          fetch-depth: 0

      # The build list of the README (docs: libfontconfig1-dev is missing there: yeslogic-fontconfig-sys),
      # plus the runtime pieces of the tests: lavapipe, Xvfb (check-gui.sh starts it), xkbcommon-x11 for winit.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev \
            libasound2-dev libjack-jackd2-dev libpipewire-0.3-dev libspa-0.2-dev \
            libdbus-1-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev libx11-xcb-dev libxcb1-dev \
            libwayland-dev libfontconfig1-dev libgl1-mesa-dev \
            mesa-vulkan-drivers libvulkan1 xvfb xauth gdb

      # rust-toolchain.toml: pinned version + rustfmt + clippy.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            test-plugins -> target
            crates/plugin-sdk -> target
          # Save the dependency builds of a red run too, so a failing test does not make the next run cold.
          cache-on-failure: true
          # PR runs restore main's cache but do not save their own: saving took up to 2 min per run (#251).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Check built-in device boundary
        env:
          DEVICE_BOUNDARY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -B scripts/test-device-boundary.py
          scripts/check-device-boundary.sh --against "$DEVICE_BOUNDARY_BASE"

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The SDK is a workspace of its own (excluded from the root), but its adapter and author crates ship in
      # every komponist-bundled-* crate.
      - name: Clippy (plugin SDK)
        run: cargo clippy --manifest-path crates/plugin-sdk/Cargo.toml --workspace --all-targets -- -D warnings

      # The SDK workflow (native-clap-sdk.yml) runs these on all three OSes; here they gate the main workflow too.
      - name: Test (plugin SDK)
        run: cargo test --manifest-path crates/plugin-sdk/Cargo.toml --workspace

      - name: Check out CLAP headers for the standalone preset fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: free-audio/clap
          ref: ca1b43ee2b4f381e94e4170e622d60b92108b128
          path: target/clap-preset-headers
          persist-credentials: false

      - name: Verify standalone CLAP preset interoperability
        run: |
          fixture="$RUNNER_TEMP/clap-preset-fixture"
          test-plugins/native-layout/c-fixture/build.sh target/clap-preset-headers/include \
            docs/clap-device-layout docs/clap-device-layout/example.json "$fixture"
          KOMPONIST_LAYOUT_FIXTURE="$fixture/layout-fixture.clap" \
            cargo test --locked -p komponist-app --test it standalone_clap_preset_round_trips

      - name: Verify standalone CLAP parameter presentation
        env:
          KOMPONIST_LAYOUT_FIXTURE: ${{ runner.temp }}/clap-preset-fixture/layout-fixture.clap
        run: cargo test --locked -p komponist-app --test it native_layout_is_discovered_edited_saved_and_revalidated

      # Without the bundles the plugin tests skip silently.
      - name: Build test plugins
        run: scripts/build-test-plugins.sh

      - name: Test plugin fixtures
        working-directory: test-plugins
        run: cargo test --workspace --locked --no-fail-fast

      - name: Exercise the SDK plugin and standard-only fallback in komponist
        run: |
          sdk=crates/plugin-sdk/Cargo.toml
          native="$RUNNER_TEMP/sdk-native-layout"
          plain="$RUNNER_TEMP/sdk-plain-layout"
          cargo run --locked --manifest-path "$sdk" -p native-clap-xtask -- bundle --out-dir "$native"
          cargo run --locked --manifest-path "$sdk" -p native-clap-xtask -- bundle --no-default-features --out-dir "$plain"
          KOMPONIST_SDK_EXAMPLE="$native/native_clap_example.clap" \
            KOMPONIST_SDK_EXAMPLE_PLAIN="$plain/native_clap_example.clap" \
            cargo test --locked -p komponist-app --test it sdk_example_uses_native_layout_and_falls_back

      - name: Allow small rendering differences in snapshots
        run: |
          cat > kittest.toml <<TOML
          threshold = ${SNAPSHOT_THRESHOLD}
          max_failed_pixels = ${SNAPSHOT_MAX_FAILED_PIXELS}
          TOML
          cat kittest.toml

      - name: Verify standalone CLAP layout graph snapshots
        env:
          KOMPONIST_LAYOUT_FIXTURE: ${{ runner.temp }}/clap-preset-fixture/layout-fixture.clap
        run: cargo test --locked -p komponist-app --test it standalone_clap_layout_renders_three_graphs

      # A hanging test (2026-11-15: dispatch::dialogs_take_the_focus_and_give_it_back) would otherwise
      # hold the job for its full hour. After TEST_WATCHDOG seconds the watchdog prints the backtraces
      # of every thread of the running test binaries and fails the step.
      - name: Test
        timeout-minutes: 30
        env:
          TEST_WATCHDOG: "1200"
        run: |
          cargo test --locked --workspace --no-fail-fast &
          tests=$!
          (
            sleep "$TEST_WATCHDOG"
            echo "::error::tests still running after ${TEST_WATCHDOG}s, dumping backtraces"
            for pid in $(pgrep -f '/target/debug/deps/'); do
              echo "=== $(tr '\0' ' ' < /proc/$pid/cmdline)"
              sudo gdb -p "$pid" -batch -ex 'thread apply all bt' 2>/dev/null | grep -vE '^\[(New|Thread debugging)|^Using host'
            done
            kill "$tests"
          ) &
          watchdog=$!
          status=0
          wait "$tests" || status=$?
          kill "$watchdog" 2>/dev/null || true
          exit "$status"

      # Starts its own Xvfb per test binary, builds the test plugins again (cached), scratch HOME.
      - name: GUI tests
        run: scripts/check-gui.sh

      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-diffs
          path: |
            crates/**/tests/snapshots/*.new.png
            crates/**/tests/snapshots/*.diff.png
          if-no-files-found: ignore
          retention-days: 14

  # macOS arm64 (epic #41, issue #48). Formatting is checked once, on Linux. No GUI tests: they need Xvfb
  # (scripts/check-gui.sh is Linux only). Snapshots render with Metal and are not compared (kittest.toml [mac]).
  macos-arm64:
    name: "macOS arm64: clippy, tests"
    runs-on: macos-15
    timeout-minutes: 75
    # A required check for main, like the Linux job (#58, branch protection).
    env:
      # The workflow-wide lavapipe setting is for Linux; here wgpu uses Metal.
      WGPU_BACKEND: metal
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Xcode command line tools, bash and rustup come with the runner image; no system packages needed.
      # rust-toolchain.toml: pinned version + rustfmt + clippy.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            test-plugins -> target
          cache-on-failure: true
          # PR runs restore main's cache but do not save their own: saving took up to 2 min per run (#251).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check built-in device boundary
        run: scripts/check-device-boundary.sh

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The SDK is a workspace of its own (excluded from the root), but its adapter and author crates ship in
      # every komponist-bundled-* crate.
      - name: Clippy (plugin SDK)
        run: cargo clippy --manifest-path crates/plugin-sdk/Cargo.toml --workspace --all-targets -- -D warnings

      # Without the bundles the plugin tests skip silently.
      - name: Build test plugins
        run: scripts/build-test-plugins.sh

      - name: Test plugin fixtures
        working-directory: test-plugins
        run: cargo test --workspace --locked --no-fail-fast

      # No gdb and no /proc on macOS for a watchdog like the Linux job's: the step timeout ends a hang.
      # --no-fail-fast: every test binary runs and a red run lists all its failures, not only the
      # first binary's (until #94 the crates after komponist-app never ran here).
      - name: Test
        timeout-minutes: 40
        env:
          # The soak's callback minimum (75 % in debug builds) measures the scheduler of this 3-vCPU
          # shared VM, not the app: the null backend's normal-priority timer thread woke too late
          # and lost 27-35 % of its callbacks, with 0-1 overruns (#94). 50 % still catches a stalled
          # or deadlocked audio thread; the timing checks are the release soak and the perf suites
          # (docs/PERFORMANCE.md).
          KOMPONIST_SOAK_MIN_CALLBACKS: "50"
        run: cargo test --locked --workspace --no-fail-fast

      # The timer leeway of os_sync waits differs between macOS versions and with how idle the
      # machine is (#101); only this runner shows macOS 15. Print what the leeway checks measured
      # (timer baseline, bare kernel wait, compensated wait, learned leeway), also when they pass.
      - name: Timer leeway report
        if: always()
        timeout-minutes: 5
        run: >-
          cargo test --locked -p komponist-rt -p komponist-ipc --lib a_timed_out_wait_ends_close_to_its_deadline
          -- --nocapture

  # Windows x86_64 (port in progress, branch `windows`). Formatting is checked once, on Linux. No GUI tests
  # (scripts/check-gui.sh is Linux only). Snapshots render without a GPU (wgpu falls back to WARP on DX12) and are not
  # compared (kittest.toml [windows]). The gate passes locally on Windows 11 (with Vulkan, scripts/check.sh); this job
  # has not run on a GitHub runner yet.
  windows-x86_64:
    name: "Windows x86_64: clippy, tests"
    runs-on: windows-2025
    timeout-minutes: 90
    # Not blocking while the port is new: the job has never run on a runner (WARP, shared VM timing). Remove this
    # once the job is reliably green.
    continue-on-error: true
    env:
      # The workflow-wide lavapipe setting is for Linux.
      WGPU_BACKEND: dx12
      # A test binary ended abnormally once without a failing test (exit code 2173): show where.
      RUST_BACKTRACE: "1"
    defaults:
      run:
        # Git Bash, for the bash scripts (the default on Windows runners is PowerShell).
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A Dev Drive (ReFS on a VHDX) for the build: NTFS overhead on cargo's many small files made the Windows
      # build the slowest (#251). The checkout is copied there, and every later step works in
      # DEV_DRIVE_WORKSPACE. Its post step dismounts the drive after rust-cache's post step has saved.
      - name: Set up a Dev Drive
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 40GB
          workspace-copy: true

      # Visual Studio Build Tools (MSVC), Git Bash and rustup come with the runner image.
      # rust-toolchain.toml: pinned version + rustfmt + clippy.
      - name: Install Rust toolchain
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            ${{ env.DEV_DRIVE_WORKSPACE }} -> target
            ${{ env.DEV_DRIVE_WORKSPACE }}/test-plugins -> target
          cache-on-failure: true
          # PR runs restore main's cache but do not save their own: saving took up to 2 min per run (#251).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check built-in device boundary
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: scripts/check-device-boundary.sh

      - name: Clippy
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The SDK is a workspace of its own (excluded from the root), but its adapter and author crates ship in
      # every komponist-bundled-* crate.
      - name: Clippy (plugin SDK)
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: cargo clippy --manifest-path crates/plugin-sdk/Cargo.toml --workspace --all-targets -- -D warnings

      # Without the bundles the plugin tests skip silently.
      - name: Build test plugins
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: scripts/build-test-plugins.sh

      - name: Test plugin fixtures
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}/test-plugins
        run: cargo test --workspace --locked --no-fail-fast

      # DX12/WARP can terminate concurrent kittest renderings (exit 2173, no Rust panic). The app suite runs
      # in parallel since #251 (1028 s → 489 s; three trial runs passed); the UI suite crashed that way again
      # on 2026-11-23, so it runs one test at a time (#260, about 90 s more). Every suite runs either way.
      - name: Test
        timeout-minutes: 45
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: |
          test_status=0
          cargo test --locked --workspace --exclude komponist-ui --no-fail-fast || test_status=$?
          cargo test --locked -p komponist-ui --no-fail-fast -- --test-threads=1 || test_status=$?
          exit "$test_status"

      # ASIO (W8, cargo feature `asio`): off in the steps above, so the plain build needs no LLVM. These two build
      # komponist-audio with it. bindgen needs libclang: the windows-2025 image has LLVM 20 (per the runner-images
      # readme; C:\Program Files\LLVM is its default path, assumed here). Steinberg's ASIO SDK (host subset, GPLv3 option) is
      # vendored in vendor/asio-sdk and selected by CPAL_ASIO_DIR in .cargo/config.toml: no download. No ASIO device is opened. Untested until pushed.
      - name: Clippy and tests with ASIO
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          cargo clippy --locked -p komponist-audio --all-targets --features asio -- -D warnings
          cargo test --locked -p komponist-audio --features asio

      # The test scratch folders in target/tmp hold a file with a non-ASCII name (a plugins scan test), which
      # Git for Windows' tar cannot read when rust-cache packs target/: "File removed before we read it", and the
      # whole cache save failed, so every run built from scratch. Nothing in there is worth caching.
      # Use native path handling and retry transient Windows directory/handle races before failing cleanup.
      - name: Remove test scratch files
        if: always()
        shell: pwsh
        run: |
          $scratch = Join-Path $env:DEV_DRIVE_WORKSPACE 'target/tmp'
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            if (-not (Test-Path -LiteralPath $scratch)) { break }
            try {
              Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction Stop
              break
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds 1
            }
          }
