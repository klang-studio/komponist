# Release: runs when a GitHub release is published (the release, tag and notes are written by hand on GitHub).
# Pre-releases (v0.2.0-rc.1, v0.2-beta1 ...) trigger it too, deliberately and unfiltered: publish a pre-release
# to try this workflow. It builds komponist, checks that it starts headless and attaches
# komponist-<tag>-linux-x86_64.tar.gz, komponist-<tag>-macos-arm64.zip (ad-hoc signed app bundle, #53) and
# komponist-<tag>-windows-x86_64.zip (unsigned, untested, with ASIO) with their .sha256 files to that same release.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Linux x86_64 archive
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      CARGO_TERM_COLOR: always
      WGPU_BACKEND: vulkan
    steps:
      - name: Check the tag name
        run: |
          # The tag ends up in file names: letters, digits, dot, underscore, dash only.
          if ! [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Unsupported tag name: $TAG"
            exit 1
          fi

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev \
            libasound2-dev libjack-jackd2-dev libpipewire-0.3-dev libspa-0.2-dev \
            libdbus-1-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev libx11-xcb-dev libxcb1-dev \
            libwayland-dev libfontconfig1-dev libgl1-mesa-dev \
            mesa-vulkan-drivers libvulkan1 xvfb xauth

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Build
        run: cargo build --release -p komponist-app --bin komponist

      - name: Package
        run: |
          name="komponist-${TAG}-linux-x86_64"
          mkdir -p "dist/$name/scripts" "dist/$name/assets/icons"
          install -m755 target/release/komponist "dist/$name/komponist"
          cp -R assets/icons/hicolor "dist/$name/assets/icons/"
          cp assets/io.github.klang_studio.komponist.desktop assets/io.github.klang_studio.komponist.metainfo.xml assets/komponist-mime.xml "dist/$name/assets/"
          install -m755 scripts/install-desktop.sh "dist/$name/scripts/"
          cp LICENSE README.md "dist/$name/"
          tar -C dist -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
          echo "NAME=$name" >> "$GITHUB_ENV"

      # install-desktop.sh does `cd "$(dirname "$0")/.."`, so it needs assets/ next to scripts/
      # in the unpacked archive (the layout above). Try it from there into a scratch prefix.
      - name: Test the installer from the unpacked archive
        run: |
          mkdir unpacked
          tar -C unpacked -xzf "$NAME.tar.gz"
          (cd "unpacked/$NAME" && PREFIX="$RUNNER_TEMP/prefix" scripts/install-desktop.sh)
          test -f "$RUNNER_TEMP/prefix/share/applications/io.github.klang_studio.komponist.desktop"

      # Headless start: killed by the timeout (124) after 10 s = still running = fine; any other exit = crash.
      - name: Smoke start
        run: |
          export HOME="$RUNNER_TEMP/smoke-home" XDG_CONFIG_HOME="$RUNNER_TEMP/smoke-home/config"
          mkdir -p "$HOME"
          status=0
          (cd "unpacked/$NAME" && xvfb-run -a timeout 10 ./komponist --null-audio --no-plugin-scan) || status=$?
          echo "exit status: $status"
          if [ "$status" -ne 124 ]; then
            echo "::error::komponist did not keep running for 10 s (exit status $status)"
            exit 1
          fi

      - name: Upload to the release
        run: gh release upload "$TAG" "$NAME.tar.gz" "$NAME.tar.gz.sha256" --repo "$GITHUB_REPOSITORY"

  # macOS 14.4+, Apple Silicon only. The app is signed ad-hoc (scripts/bundle-macos.sh); once an Apple Developer
  # account exists, the script signs with a Developer ID and notarizes when KOMPONIST_SIGN_IDENTITY and the
  # notarytool credentials are set (as secrets passed to the "Bundle" step).
  macos-arm64:
    name: macOS arm64 app bundle
    runs-on: macos-15
    timeout-minutes: 75
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      CARGO_TERM_COLOR: always
    steps:
      - name: Check the tag name
        run: |
          # The tag ends up in file names: letters, digits, dot, underscore, dash only.
          if ! [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Unsupported tag name: $TAG"
            exit 1
          fi

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # Xcode command line tools and rustup come with the runner image; no system packages needed.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Bundle
        run: scripts/bundle-macos.sh

      # ditto keeps the signature, the resource forks and the symlinks of the bundle (zip(1) does not).
      - name: Package
        run: |
          name="komponist-${TAG}-macos-arm64"
          ditto -c -k --keepParent dist/komponist.app "$name.zip"
          shasum -a 256 "$name.zip" > "$name.zip.sha256"
          cat "$name.zip.sha256"
          echo "NAME=$name" >> "$GITHUB_ENV"

      # Unpack the archive as a user would and check what is in it. No window: a GUI start needs a display
      # session, so this runs the command line paths (`--help` of the app and of the bridge mode, which the
      # app starts for every plugin) and verifies the signature survived the zip.
      - name: Check the unpacked app
        run: |
          mkdir unpacked
          ditto -x -k "$NAME.zip" unpacked
          app=unpacked/komponist.app
          codesign --verify --deep --strict --verbose=2 "$app"
          # Into a variable first: `grep -q` in a pipe can end early and fail the step under pipefail.
          entitlements="$(codesign -d --entitlements - "$app" 2>&1)"
          case "$entitlements" in *com.apple.security.cs.disable-library-validation*) ;; *) echo "::error::entitlement missing"; exit 1 ;; esac
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = 14.4
          "$app/Contents/MacOS/komponist" --help
          "$app/Contents/MacOS/komponist" --bridge --help

      - name: Upload to the release
        run: gh release upload "$TAG" "$NAME.zip" "$NAME.zip.sha256" --repo "$GITHUB_REPOSITORY"

  # Windows 11 x86_64 (MSVC). UNTESTED until the workspace builds on Windows (Windows port, W4b/W5): this job has
  # never run. The zip is unsigned (SmartScreen note in docs/INSTALL.md); once a code signing certificate exists,
  # scripts/package-windows.sh signs with Authenticode when KOMPONIST_SIGN_CERT (+ KOMPONIST_SIGN_PASSWORD) or
  # KOMPONIST_SIGN_THUMBPRINT is set (as secrets passed to the "Package" step).
  windows-x86_64:
    name: Windows x86_64 zip (untested)
    runs-on: windows-2025
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      CARGO_TERM_COLOR: always
    steps:
      - name: Check the tag name
        run: |
          # The tag ends up in file names: letters, digits, dot, underscore, dash only.
          if ! [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Unsupported tag name: $TAG"
            exit 1
          fi

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # Visual Studio Build Tools (MSVC, rc.exe) and rustup come with the runner image; no system packages needed.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Builds komponist (release), assembles dist/<name>/ (komponist.exe, LICENSE, README.txt) and zips it with bsdtar.
      # ASIO is part of the release build (cargo feature `asio`, set by the script): bindgen needs libclang, which
      # the windows-2025 image has with LLVM 20 (runner-images readme; C:\Program Files\LLVM is its default path,
      # assumed here; if it is missing, add a step with `choco install llvm`). Steinberg's ASIO SDK (host subset) is vendored in
      # vendor/asio-sdk (CPAL_ASIO_DIR in .cargo/config.toml): nothing is downloaded, the sources are not part of the zip. Untested until pushed.
      - name: Package
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          name="komponist-${TAG}-windows-x86_64"
          scripts/package-windows.sh --name "$name"
          mv "dist/$name.zip" "dist/$name.zip.sha256" .
          echo "NAME=$name" >> "$GITHUB_ENV"

      # Unpack the archive as a user would and check what is in it. No window: a GUI start needs a desktop
      # session, so this runs the command line paths (`--help` of the app and of the bridge mode, which the app
      # starts for every plugin). The release binary uses the windows subsystem; with stdout piped (`| cat`) the
      # output reaches the step and `cat` keeps the shell waiting until the process has ended.
      - name: Check the unpacked zip
        run: |
          sha256sum -c "$NAME.zip.sha256"
          mkdir unpacked
          /c/Windows/System32/tar.exe -xf "$NAME.zip" -C unpacked
          exe="unpacked/$NAME/komponist.exe"
          test -f "$exe"
          test -f "unpacked/$NAME/LICENSE"
          test -f "unpacked/$NAME/README.txt"
          help="$("$exe" --help | cat)"
          echo "$help"
          case "$help" in *"usage: komponist"*) ;; *) echo "::error::komponist.exe --help printed no usage"; exit 1 ;; esac
          bridge_help="$("$exe" --bridge --help | cat)"
          echo "$bridge_help"
          test -n "$bridge_help"

      - name: Upload to the release
        run: gh release upload "$TAG" "$NAME.zip" "$NAME.zip.sha256" --repo "$GITHUB_REPOSITORY"
