[package]
name = "komponist-rt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(unix)'.dependencies]
# pthread scheduling (Linux), Mach thread policy, os_sync wait/wake (macOS).
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# MMCSS (avrt) and the thread priority fallback.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
assert_no_alloc.workspace = true
