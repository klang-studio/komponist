[package]
name = "komponist-rt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
# pthread scheduling (Linux), Mach thread policy, os_sync wait/wake (macOS).
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The futex of `os_sync` (thread) and its absolute CLOCK_MONOTONIC deadline (time).
rustix = { workspace = true, features = ["time"] }

[target.'cfg(windows)'.dependencies]
# MMCSS (avrt), the thread priority fallback, and WaitOnAddress / WakeByAddress* of `os_sync`.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
assert_no_alloc.workspace = true
