[package]
name = "komponist-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Engine and filesystem fault injection for the app's unit tests.
test-support = []

[dependencies]
komponist-audio.workspace = true
komponist-engine.workspace = true
komponist-ipc.workspace = true
komponist-model.workspace = true
komponist-plugin-api.workspace = true
komponist-plugins.workspace = true
komponist-processor.workspace = true
tempfile.workspace = true
hound.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
komponist-engine = { workspace = true, features = ["recording-test-support"] }
assert_no_alloc.workspace = true
