[package]
name = "komponist-hosting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Shared plugin vocabulary and the per-block wire types (no plugin format, no audio backend).
komponist-ipc.workspace = true
komponist-plugin-api.workspace = true
# CLAP hosting (WP-26).
clack-host.workspace = true
clap-sys.workspace = true
clack-extensions = { workspace = true, features = [
    "clack-host",
    "audio-ports",
    "audio-ports-config",
    "gui",
    "latency",
    "log",
    "note-name",
    "note-ports",
    "params",
    "preset-discovery",
    "render",
    "state",
    "state-context",
    "thread-check",
    "timer",
] }
# VST3 hosting (WP-32).
vst3.workspace = true
# Parameter changes between the VST3 controller (main thread) and processor (RT thread).
rtrb.workspace = true

[target.'cfg(unix)'.dependencies]
# CLAP posix-fd-support: Linux and macOS only (the extension is built on `std::os::unix`, and
# Windows plugins use their own window messages and timers instead).
clack-extensions = { workspace = true, features = ["posix-fd"] }
# dlopen and its per-OS RTLD_* flags (`library.rs`).
libc.workspace = true
# poll() and eventfd for the reference `PollLoop`.
rustix = { workspace = true, features = ["event", "pipe"] }

[target.'cfg(windows)'.dependencies]
# Foundation (handles, errors), LibraryLoader (LoadLibraryExW, GetProcAddress and the pin of
# GetModuleHandleExW, `library.rs`), Threading (the wake event and the high-resolution waitable
# timer of `host_loop::wake`), WindowsAndMessaging (its message pump).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# RT checks around `HostedProcessor::process`.
assert_no_alloc.workspace = true
# Klopfer's state (JSON) in the VST3 installed-plugin tests.
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Parent windows for the GUI tests (run under Xvfb only).
x11rb = { workspace = true, features = ["xtest"] }
