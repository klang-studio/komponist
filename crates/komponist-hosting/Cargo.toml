[package]
name = "komponist-hosting"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Shared plugin vocabulary and the per-block wire types (no plugin format, no audio backend).
komponist-ipc.workspace = true
# CLAP hosting (WP-26).
clack-host.workspace = true
clack-extensions = { workspace = true, features = [
    "clack-host",
    "audio-ports",
    "gui",
    "latency",
    "log",
    "note-name",
    "note-ports",
    "params",
    "posix-fd",
    "render",
    "state",
    "thread-check",
    "timer",
] }
# poll() and eventfd for the reference `PollLoop`.
rustix = { workspace = true, features = ["event"] }

[dev-dependencies]
# RT checks around `HostedProcessor::process`.
assert_no_alloc.workspace = true
# Parent windows for the GUI tests (run under Xvfb only).
x11rb = { workspace = true, features = ["xtest"] }
