[package]
name = "komponist-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
komponist-plugin-api.workspace = true
# The shared-scope wait and wake of the block handshake (`os_sync`; #45, #243) and, on macOS, the
# Mach clock and the time-constraint policy in a test.
komponist-rt.workspace = true
serde.workspace = true
postcard = { workspace = true, features = ["use-std"] }

[target.'cfg(unix)'.dependencies]
# Workspace features (mm, thread, process, net) plus: fs (memfd, seals, fstat), event (poll on
# pidfds, kqueue on macOS), time (the `Timespec` of the process watcher's waits).
rustix = { workspace = true, features = ["fs", "event", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
# POSIX shared memory (`shm_open`) in place of memfd; the page size for its rounded size.
rustix = { workspace = true, features = ["shm", "param"] }

[target.'cfg(windows)'.dependencies]
# Foundation (handles, DuplicateHandle, errors), Security (the SECURITY_ATTRIBUTES parameter of
# the create calls), Threading (events, high-resolution waitable timers, process handles), Memory (CreateFileMappingW, MapViewOfFile, VirtualLock), Pipes + Storage_FileSystem +
# System_IO (the overlapped duplex named pipe of the control channel), JobObjects + ToolHelp
# (bridges and scans end with the app: job objects, resuming a child created suspended; #218).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
assert_no_alloc.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# Test children that crash on purpose turn off the Windows Error Reporting dialog (SetErrorMode).
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_Debug"] }
