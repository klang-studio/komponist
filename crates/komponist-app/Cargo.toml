[package]
name = "komponist-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "komponist"
path = "src/main.rs"

[dependencies]
komponist-model.workspace = true
# Waveforms of audio clips: the file pool and its peak cache (`views/arrangement/files`).
komponist-audiofile.workspace = true
komponist-engine.workspace = true
komponist-processor.workspace = true
komponist-audio.workspace = true
komponist-plugins.workspace = true
# `komponist --bridge`: the plugin bridge runs inside this executable, in its own process (WP-94).
komponist-bridge.workspace = true
# Parameter, note-name, GUI-size and log types of the plugin manager's API (`device_host`).
komponist-ipc.workspace = true
komponist-ui.workspace = true
# `Lang` and the generated texts (`panels::dock` is the pilot; `docs/I18N.md`).
komponist-i18n.workspace = true
# `Language::System`: the language of the desktop, read in `main()` only.
sys-locale.workspace = true
komponist-tokens = { workspace = true, features = ["egui"] }
klang-dsp.workspace = true
egui.workspace = true
eframe.workspace = true
serde.workspace = true
# settings.json, recent.json.
serde_json.workspace = true
# The live spectrum of the EQ (`spectrum`).
realfft.workspace = true
# Local time of recent projects and plugin scans (`dialogs::format`).
libc.workspace = true
# WAV files of the showcase project and the tests.
hound.workspace = true
tempfile.workspace = true
# Debug builds abort on any allocation inside the audio callback and the offline render
# (ARCHITECTURE §6.1).
assert_no_alloc.workspace = true

[features]
# ASIO on Windows (W8): forwards to komponist-audio (needs LLVM; the ASIO SDK comes from vendor/asio-sdk,
# ARCHITECTURE §7). Off by default; scripts/package-windows.sh turns it on.
asio = ["komponist-audio/asio"]

[dev-dependencies]
# Snapshot and interaction tests of the shell (`tests/`).
komponist-ui = { workspace = true, features = ["snapshot"] }
egui_kittest.workspace = true
# Virtual MIDI output port for the hardware-input test (`tests/it/hardware_midi.rs`).
midir.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The native app menu (About, Settings, Quit; `macos_menu`, issue #47). Already in the tree through
# eframe/winit; licences MIT and Zlib OR Apache-2.0 OR MIT.
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
# The observer of the app's activation (plugin frames, #52); already in the tree through objc2.
block2.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Plugin frames (WP-50): the X11 child window a plugin GUI attaches to, the frame's window lookup by
# title, the key grabs (ARCHITECTURE §8.4). macOS frames come with #52.
x11rb.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Real-window plugin frame tests under Xvfb (`tests/plugin_frame_gui.rs`): an event loop on the
# test thread (`with_any_thread`), synthetic input (XTEST) and the bridge owning a plugin window
# (X-Resource).
winit.workspace = true
x11rb = { workspace = true, features = ["xtest", "res"] }

[target.'cfg(windows)'.build-dependencies]
# Icon, version information and manifest of komponist.exe (`build.rs`, ARCHITECTURE §8.8).
embed-resource.workspace = true

[target.'cfg(windows)'.dependencies]
# Console attach for `--help` in the windows-subsystem build (`main.rs`); known folders and drives (`dirs.rs`).
# The frame activation with the bridges (`windows::plugin_frame::activation`, port W6): the foreground
# hook (Accessibility), the z-order and foreground calls (WindowsAndMessaging), the bridges among
# the processes (ToolHelp, Threading).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
# Child-process checks of the app tests (`tests/common`): a Toolhelp snapshot of the bridges and
# `GetExitCodeProcess` for "is it gone".
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
