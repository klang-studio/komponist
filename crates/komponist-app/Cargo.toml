[package]
name = "komponist-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "komponist"
path = "src/main.rs"

# Headless demo player (WP-28, gate G3): plays a project through the engine and hexa.
[[bin]]
name = "komponist-play"
path = "src/bin/komponist-play.rs"

[dependencies]
komponist-model.workspace = true
komponist-engine.workspace = true
komponist-audio.workspace = true
komponist-builtin.workspace = true
komponist-plugins.workspace = true
# `komponist --bridge`: the plugin bridge runs inside this executable, in its own process (WP-94).
komponist-bridge.workspace = true
# Parameter, note-name, GUI-size and log types of the plugin manager's API (`device_host`).
komponist-ipc.workspace = true
komponist-ui.workspace = true
# `Lang` and the generated texts (`panels::dock` is the pilot; `docs/I18N.md`).
komponist-i18n.workspace = true
# `Language::System`: the language of the desktop, read in `main()` only.
sys-locale.workspace = true
komponist-tokens = { workspace = true, features = ["egui"] }
klang-dsp.workspace = true
egui.workspace = true
eframe.workspace = true
serde.workspace = true
# settings.json, recent.json.
serde_json.workspace = true
# The live spectrum of the EQ (`spectrum`).
realfft.workspace = true
# Local time of recent projects and plugin scans (`dialogs::format`).
libc.workspace = true
# komponist-play: WAV export.
hound.workspace = true
# komponist-play: debug builds abort on any allocation inside the audio callback and the offline
# render (ARCHITECTURE §6.1).
assert_no_alloc.workspace = true

[dev-dependencies]
# Snapshot and interaction tests of the shell (`tests/`).
komponist-ui = { workspace = true, features = ["snapshot"] }
egui_kittest.workspace = true
# Virtual MIDI output port for the hardware-input test (`tests/it/hardware_midi.rs`).
midir.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Plugin frames (WP-50): the X11 child window a plugin GUI attaches to, the frame's window lookup by
# title, the key grabs (ARCHITECTURE §8.4). macOS frames come with #52.
x11rb.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Real-window plugin frame tests under Xvfb (`tests/plugin_frame_gui.rs`): an event loop on the
# test thread (`with_any_thread`), synthetic input (XTEST) and the bridge owning a plugin window
# (X-Resource).
winit.workspace = true
x11rb = { workspace = true, features = ["xtest", "res"] }
