[package]
name = "komponist-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
# `realtime-dbus`: cpal promotes its PipeWire and ALSA audio threads to real-time priority through
# RTKit (audio_thread_priority); plain `realtime` is a no-op on Linux in audio_thread_priority 0.35.
cpal = { workspace = true, features = ["realtime-dbus"] }
midir.workspace = true
rtrb.workspace = true
# The device's audio workgroup handed to the engine's workers (macOS, #45).
komponist-rt.workspace = true
# The stream callback runs inside `assert_no_alloc` in debug builds (ARCHITECTURE §6.1); it only
# reports when the binary installs `assert_no_alloc::AllocDisabler` as its allocator.
assert_no_alloc.workspace = true

[dev-dependencies]
klang-dsp.workspace = true
serde_json.workspace = true
