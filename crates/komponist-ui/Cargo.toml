[package]
name = "komponist-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "komponist-gallery"
path = "src/bin/gallery.rs"

[features]
# `komponist_ui::snapshot`: the egui_kittest harness helpers for snapshot tests. Only tests need it;
# the dev-dependency on this crate below turns it on for unit and integration tests.
snapshot = ["dep:egui_kittest"]

[dependencies]
komponist-tokens = { workspace = true, features = ["egui"] }
# dB / pan formatting and parsing for the value controls (decided at G1); time, notes and clips
# for the timeline paint functions.
komponist-model.workspace = true
# `Lang`: the language of the UI, stored per egui `Context` (`lang`, `set_lang`).
komponist-i18n.workspace = true
# The plugin frame header's model and events (`plugin_frame::header`), plain data shared with the
# bridge, which draws the header itself on macOS (#52).
komponist-ipc.workspace = true
# Peak meter ballistics (`meter::PeakMeter`) and dB ↔ gain.
klang-dsp.workspace = true
egui.workspace = true
eframe.workspace = true
egui_extras.workspace = true
winit.workspace = true
egui_kittest = { workspace = true, optional = true }

# The primary monitor's work area and the system DPI for the first window's size (`windows_work_area`).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
komponist-ui = { path = ".", features = ["snapshot"] }

# `cargo bench -p komponist-ui --bench timeline`: paint 10 000 notes, report the CPU time.
[[bench]]
name = "timeline"
harness = false
