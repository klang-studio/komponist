[package]
name = "hexa-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "hexa, the 6-operator FM synth engine of komponist (no_std-friendly DSP core)"

[lints]
workspace = true

[lib]
name = "hexa_core"

[dependencies]
libm.workspace = true
klang-dsp.workspace = true
serde = { version = "1.0.229", default-features = false, features = ["derive"], optional = true }
postcard = { version = "1.1.3", default-features = false, optional = true }

[features]
# `Synth::boxed`, a synth on the heap.
alloc = []
serde = ["dep:serde"]
# Binary patch encoding for device links (module `wire`).
wire = ["serde", "dep:postcard"]
