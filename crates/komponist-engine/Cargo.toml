[package]
name = "komponist-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
komponist-model.workspace = true
# Disk streaming of audio clips (#11): seekable decoding, sample-rate conversion, the file pool.
komponist-audiofile.workspace = true
komponist-stretch.workspace = true
klang-dsp.workspace = true
rtrb.workspace = true
hound.workspace = true
tempfile.workspace = true
# Realtime set-up of the workers (SCHED_FIFO, time-constraint policy, audio workgroup) and the
# macOS os_sync wait with its timer-leeway compensation (#45).
komponist-rt.workspace = true
# The export's render calls run inside `assert_no_alloc` (it reports only in binaries and tests that
# install `assert_no_alloc::AllocDisabler`; a no-op in release builds).
assert_no_alloc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Futex wait/wake of the worker pool (WP-65); already a workspace dependency (komponist-ipc).
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
# WaitOnAddress / WakeByAddress* of the worker pool (W3).
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }
