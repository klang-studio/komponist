[package]
name = "komponist-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
recording-test-support = []

[dependencies]
komponist-processor.workspace = true
komponist-model.workspace = true
# Disk streaming of audio clips (#11): seekable decoding, sample-rate conversion, the file pool.
komponist-audiofile.workspace = true
komponist-stretch.workspace = true
klang-dsp.workspace = true
rtrb.workspace = true
hound.workspace = true
tempfile.workspace = true
# Realtime set-up of the workers (SCHED_FIFO, time-constraint policy, audio workgroup) and their
# wait/wake (`os_sync`: futex, os_sync_wait_on_address, WaitOnAddress; #45, #243).
komponist-rt.workspace = true
# The export's render calls run inside `assert_no_alloc` (it reports only in binaries and tests that
# install `assert_no_alloc::AllocDisabler`; a no-op in release builds).
assert_no_alloc.workspace = true

[dev-dependencies]
komponist-session.workspace = true
