[package]
name = "komponist-plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
komponist-builtin.workspace = true
komponist-i18n.workspace = true
komponist-model.workspace = true
komponist-engine.workspace = true
komponist-ipc.workspace = true
komponist-hosting.workspace = true
rtrb.workspace = true
serde.workspace = true
# The scan cache file and the JSON output of `komponist-bridge --scan`.
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
# Workspace features (mm, thread, process, net) plus: event (poll on control sockets, scan pipes
# and pidfds).
rustix = { workspace = true, features = ["event"] }

[target.'cfg(windows)'.dependencies]
# Foundation (handles, errors), Pipes (PeekNamedPipe on a scan's output pipes), Threading
# (waiting on a scan's process handle).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Integration tests run `Engine::process` and `ExternalProcessor::process` inside `assert_no_alloc`.
assert_no_alloc.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# Ending and stopping bridges from outside in the lifecycle tests (TerminateProcess,
# DebugActiveProcess); the scan tests list their child processes (Toolhelp).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[target.'cfg(any(target_os = "macos", windows))'.dev-dependencies]
# The deadline test uses the audio callback's realtime scheduling policy.
komponist-rt.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Parent windows and fake pointer input for the GUI routing tests (run under Xvfb only).
x11rb = { workspace = true, features = ["xtest"] }
