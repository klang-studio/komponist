[package]
name = "komponist-plugins"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
komponist-model.workspace = true
komponist-engine.workspace = true
komponist-ipc.workspace = true
serde.workspace = true
# The scan cache file and the JSON output of `komponist-bridge --scan`.
serde_json.workspace = true
# Workspace features (mm, thread, process, net) plus: event (poll on control sockets, scan pipes
# and pidfds).
rustix = { workspace = true, features = ["event"] }

[dev-dependencies]
# Integration tests run `Engine::process` and `ExternalProcessor::process` inside `assert_no_alloc`.
assert_no_alloc.workspace = true
# Parent windows and fake pointer input for the GUI routing tests (run under Xvfb only).
x11rb = { workspace = true, features = ["xtest"] }
